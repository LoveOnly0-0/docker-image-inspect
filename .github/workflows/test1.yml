name: Download Image from Alibaba Cloud  
  
on:  
  push:  
    branches: [ main ]  

jobs:  
  download-image:  
    runs-on: ubuntu-latest  
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v2.2.0
