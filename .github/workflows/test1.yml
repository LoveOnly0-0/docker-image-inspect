name: Download Image from Alibaba Cloud  
  
on:  
  push:  
    branches: [ main ]  

jobs:  
  download-image:  
    runs-on: ubuntu-latest  
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v2.2.0
    #   with:
    #     registry: https://tlw1zoz0.mirror.aliyuncs.com/jenkins #注意这里
    #     username: 18142600980
    #     password: qjj19971111
    #     logout: false
          
    - name: Pull Docker Images and Package
      run: |
          # docker pull  https://tlw1zoz0.mirror.aliyuncs.com/jenkins
          docker pull registry.cn-hangzhou.aliyuncs.com/jenkins/jenkins:lts
          docker save registry.cn-hangzhou.aliyuncs.com/jenkins/jenkins:lts -o jenkins.tar 
  

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: jenkins.tar
        path: jenkins.tar
        retention-days: 1  # 将保留天数设置为 1 天 最多可设置90天


